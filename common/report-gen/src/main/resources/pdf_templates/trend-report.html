<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
    <title>Trend Report</title>
    <style>
        @page {
            size: A4;
            margin: 10mm 10mm 20mm;
        }

        @page {
            @bottom-center {
                content: element(footer_component);
            }
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
        }

        .header {
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header .sub-header {
            text-align: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
        }
        .header .sub-header .location {
            font-weight: bold;
            font-size: 18px;
        }
        .header .sub-header .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header .sub-header .logo img {
            height: 50px;
            width: 180px;
        }

        .report-details-header {
            width: 100%;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .report-details-header td label {
            font-weight: bold;
            padding-left: 2px;
        }

        .report-details-header td, .report-details-header th {
            border: 1px solid black;
            padding: 3px;
            word-wrap: break-word;
            margin: 0 !important;
        }

        .chart-container {
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }

        .chart-container img {
            max-width: 100%;
            height: auto;
        }

        .footer_component {
            position: running(footer_component);
            width: 100%;
            font-size: 10pt;
            text-align: center;
            padding: 10px 0;
        }

        .page-break {
            page-break-after: always;
        }

        label {
            font-weight: bold;
        }

        .colon {
            margin: 0 5px;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="sub-header">
        <div class="logo">
            <img src="images/logo.png" alt="Granules Logo"/>
        </div>
        <div class="title" th:text="${chartTitle}">Temperature and Humidity Trend</div>
    </div>
</div>

<div class="report-details-header">
    <table style="width: 100%; table-layout: fixed; border-collapse: collapse;">
        <tr>
            <td style="width: 50%;">
                <label>Device Name</label><span class="colon">:</span><span th:text="${entityName}"></span>
            </td>
            <td style="width: 50%;">
                <label>Start Date</label><span class="colon">:</span><span th:text="${startDate}"></span>
            </td>
        </tr>
        <tr>
            <td>
                <label>Start Time</label><span class="colon">:</span><span th:text="${startTime}"></span>
            </td>
            <td>
                <label>End Date</label><span class="colon">:</span><span th:text="${endDate}"></span>
            </td>
        </tr>
        <tr>
            <td>
                <label>End Time</label><span class="colon">:</span><span th:text="${endTime}"></span>
            </td>
            <td>
                <label>Printed Date &amp; Time</label><span class="colon">:</span><span th:text="${printTime}"></span>
            </td>
        </tr>
    </table>
</div>

<div class="chart-container">
    <img th:src="${'data:image/png;base64,' + chartImageBase64}" alt="Trend Chart"/>
</div>

<div>
    <div style="text-align: left; vertical-align: middle; margin-top: 30px;">
        <span>Printed By: <span th:text="${username}"></span></span>
    </div>
</div>

<div th:fragment="footer">
    <div id="footer_component" class="footer_component">
        <div class="footer-content">
            <div class="center" style="text-align: center; vertical-align: middle">
                <span>Page <span class="pagenumber"></span> of <span class="pagecount"></span></span>
            </div>
        </div>
    </div>
</div>

</body>
</html>

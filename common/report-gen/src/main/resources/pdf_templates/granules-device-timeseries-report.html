<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
    <title>Audit Logs Report</title>
    <style>
        @page {
            size: A4;
            margin: 10mm 10mm 20mm;
        }

        @page {
            @bottom-center {
                content: element(footer_component);
            }
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
        }

        .header {
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header .sub-header {
            text-align: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
        }
        .header .sub-header .location {
            font-weight: bold;
            font-size: 18px;
        }
        .header .sub-header .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header .sub-header .logo img {
            height: 50px;
            width: 180px; /* Adjust as needed */
        }

        .report-details-header {
            width: 100%;
            overflow: hidden;
        }

        .report-details-header td label {
            font-weight: bold;
            padding-left: 2px;
        }

        .report-details-header td, .report-details-header th {
            border: 1px solid black;
            padding: 3px;
            word-wrap: break-word;
            margin: 0 !important;
        }

        .pdf-report {
            margin-top: 20px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-bottom: 20px;
        }

        .data-table th, .data-table td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            word-wrap: break-word;
        }

        .data-table td {
            font-size: small;
        }

        .data-table th {
            background-color: #f2f2f2;
        }

        .page-break {
            page-break-after: always;
        }

        #footer_component {
            width: 100%;
            text-align: center;
            position: running(footer_component);
            font-size: 12px;
            border-top: 1px solid #000;
        }

        #footer_component .footer-content .center:after {
            text-align: center;
            content: "Page " counter(page) " of " counter(pages);
        }

        .table-container {
            display: table;
            width: 100%;
        }

        .table-row {
            display: table-row;
        }

        .table-cell {
            display: table-cell;
            width: 50%; /* Adjust width as needed */
            padding: 0 10px; /* Add padding for spacing */
            vertical-align: middle; /* Align content to the top */
        }

    </style>
</head>
<body>
<div class="header">
    <table style="width: 100%;" class="sub-header">
        <tr>
            <td class="first-page-header-logo" style="width: 20%; text-align: left;">
                <div class="logo">
                    <img class="granules_logo" src="" alt="Logo"/>
                </div>
            </td>
            <td style="width: 60%; text-align: center;">
                <h2 class="location">Unit Name : Gagillapur</h2>
                <h1 class="title">Temperature and RH Data Report</h1>
            </td>
            <td style="width: 20%;">
                <!-- Empty cell for balance -->
            </td>
        </tr>
    </table>
</div>
<div class="report-details-header">
    <table style="width: 100%; border-collapse: collapse; table-layout: fixed;">
        <tr style="text-align: left; vertical-align: middle;">
            <td>
                <label>Block</label><span class="colon"> : </span><span th:text="${deviceBuilding}"></span>
            </td>
            <td>
                <label>Start Date</label><span class="colon"> : </span><span th:text="${startDate}"></span>
            </td>
        </tr>
        <tr style="text-align: left; vertical-align: middle;">
            <td>
                <label>Area</label><span class="colon"> : </span><span th:text="${deviceArea}"></span>
            </td>
            <td>
                <label>Start Time</label><span class="colon"> : </span><span th:text="${startTimeOnly}"></span>
            </td>
        </tr>
        <tr>
            <td>
                <label>Location</label><span class="colon"> : </span><span th:text="${deviceLocation}"></span>
            </td>
            <td>
                <label>End Date </label><span class="colon"> : </span><span th:text="${endDate}"></span>
            </td>
        </tr>
        <tr>
            <td>
                <label>Inst ID</label><span class="colon"> : </span><span th:text="${entityName}"></span>
            </td>
            <td>
                <label>End Time</label><span class="colon"> : </span><span th:text="${endTimeOnly}"></span>
            </td>
        </tr>
        <tr>
            <td>
                <label>Temp. Limit</label>
                <span class="colon"> : </span>
                <span th:if="${temperatureNmtEnabled == false && temperatureNltEnabled == false}">NIL</span>
                <span th:if="${temperatureNmtEnabled == true}"
                      th:text="'NMT ' + ${temperatureNmtValue}"></span>
                <span th:if="${temperatureNmtEnabled == true && temperatureNltEnabled==true}">,</span>
                <span th:if="${temperatureNltEnabled == true}"
                      th:text="'NLT ' + ${temperatureNltValue}"></span>
            </td>
            <td>
                <label>RH Limit</label>
                <span class="colon"> : </span>
                <span th:if="${isHumidityDisabled == true}">NIL</span>
                <span th:if="${isHumidityDisabled != true}">
                    <span th:if="${humidityNmtEnabled == false && humidityNltEnabled == false}">NIL</span>
                    <span th:if="${humidityNmtEnabled == true}" th:text="'NMT ' + ${humidityNmtValue}"></span>
                    <span th:if="${humidityNmtEnabled == true && humidityNltEnabled==true}">,</span>
                    <span th:if="${humidityNltEnabled == true}" th:text="'NLT ' + ${humidityNltValue}"></span>
                </span>
            </td>
        </tr>
        <tr>
            <td>
                <span th:if="${maxTemperature != null}">
                    <label>Temp. Max</label><span class="colon"> : </span><span th:text="${maxTemperature}"></span>
                </span>
                <span th:if="${maxTemperature != null && minTemperature != null}">, </span>
                <span th:if="${minTemperature != null}">
                    <label>Temp. Min</label><span class="colon"> : </span><span th:text="${minTemperature}"></span>
                </span>
            </td>
            <td>
                <span th:if="${isHumidityDisabled == true}">
                    <label>RH Max</label><span class="colon"> : </span><span>NIL</span>, 
                    <label>RH Min</label><span class="colon"> : </span><span>NIL</span>
                </span>
                <span th:if="${isHumidityDisabled != true}">
                    <span th:if="${maxHumidity != null}">
                        <label>RH Max</label><span class="colon"> : </span><span th:text="${maxHumidity}"></span>
                    </span>
                    <span th:if="${maxHumidity != null && minHumidity != null}">, </span>
                    <span th:if="${minHumidity != null}">
                        <label>RH Min</label><span class="colon"> : </span><span th:text="${minHumidity}"></span>
                    </span>
                </span>
            </td>
        </tr>
        <tr>
            <td>
                <span th:if="${isMktCalculationEnabled == true && mktValue != null}">
                    <label>MKT</label><span class="colon"> : </span><span th:text="${mktValue}"></span>
                </span>
            </td>
            <td>
                <label>Interval</label><span class="colon"> : </span><span th:text="${readableInterval}"></span>
            </td>
        </tr>
    </table>
</div>
<div th:fragment="footer">
    <div id="footer_component" class="table-container footer_component">
        <div class="footer-content table-row ">
            <div class="center table-cell" style="text-align: center; vertical-align: middle">
            </div>
        </div>
    </div>
</div>

<div class="pdf-report" th:each="telemetryPage, pageStat : ${paginatedTelemetryData}">
    <table class="data-table">
        <thead>
        <tr>
            <th>DATE</th>
            <th>TIME</th>
            <th>TEMPERATURE (°C)</th>
            <th>RELATIVE HUMIDITY(%)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="telemetryData : ${telemetryPage}">
            <td th:text="${telemetryData.getDate()}"></td>
            <td th:text="${telemetryData.getTime()}"></td>
            <td th:style="${telemetryData.isTempBolded()} ? 'font-weight: bold;' : ''"
                th:text="${telemetryData.getTemperature()}"></td>
            <td th:style="${telemetryData.isHumBolded()} ? 'font-weight: bold;' : ''"
                th:text="${telemetryData.getHumidity()}"></td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{::footer}"></div>
    <div th:if="${!pageStat.last}" class="page-break" style="margin-top: 20px"></div>
</div>

<div style="page-break-after: always"></div>

<div class="last-page">

    <div class="printed-details table-container" style="margin-top: 750px">

        <div style="text-align: left; vertical-align: middle; margin-bottom: 10px;">
            <span style="font-weight: bold">Temp</span> <span> - Temperature, </span><span
                style="font-weight: bold">RH </span><span> - Relative Humidity</span><br></br>
        </div>

        <div style="text-align: left; vertical-align: middle; margin-bottom: 30px;"
             th:if="${temperatureNmtEnabled == true || temperatureNltEnabled == true || humidityNltEnabled == true || humidityNmtEnabled == true}">
            <span style="font-weight: bold">Legend</span>:
            <span th:if="${temperatureNmtEnabled == true || humidityNmtEnabled == true}">NMT - Not More Than</span>
            <span th:if="${(temperatureNmtEnabled == true || humidityNmtValue == true)
                      && (temperatureNltEnabled == true || humidityNltEnabled == true)}">,</span>
            <span th:if="${temperatureNltEnabled == true || humidityNltEnabled == true}"> NLT - Not Less Than</span>
        </div>

        <div style="text-align: left; vertical-align: middle; margin-bottom: 10px;">
            <span>Printed By: <span th:text="${username}"></span></span><br></br>
        </div>

        <div style="text-align: left; vertical-align: middle; margin-bottom: 10px;">
            <span>Printed Date &amp; Time : <span th:text="${printTime}"></span></span><br></br>
        </div>

        <div style="text-align: left; vertical-align: middle; margin-bottom: 10px;">
            <label for="remarks_text" style="display: block; margin-bottom: 5px; font-weight: bold;">Remarks:</label>
            <div class="remarks-text" id="remarks_text" style="width: 95%; border-bottom: 1px dotted #000">
            </div>
        </div>

    </div>
    <div th:replace="~{::footer}"></div>
</div>
</body>
</html>
